[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
composeBom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
room = "2.8.5"
datastore = "1.3.0"
coroutines = "1.11.0"
litertlm = "0.19.0"
litert = "2.3.0"
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
okhttp = "5.5.1"
orgJson = "20260814"
camerax = "1.6.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
